<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS5 Türkçe Çeviri V2</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0d0f12;
color:white;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.app{
max-width:800px;
margin:auto;
padding:18px;
}

h1{
font-size:25px;
margin:5px 0;
}

.desc{
color:#999;
margin-bottom:18px;
}

.camera{
position:relative;
width:100%;
aspect-ratio:16/10;
background:#000;
border-radius:18px;
overflow:hidden;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

.scan{
position:absolute;
left:5%;
right:5%;
bottom:5%;
height:32%;
border:2px solid white;
border-radius:12px;
box-shadow:0 0 12px rgba(255,255,255,.5);
}

.controls{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:12px;
}

button{
border:0;
border-radius:12px;
padding:13px 17px;
font-size:16px;
font-weight:700;
background:white;
color:#111;
}

button.dark{
background:#292d33;
color:white;
}

.result{
margin-top:15px;
background:#1a1d22;
border-radius:15px;
padding:17px;
}

.label{
font-size:13px;
color:#999;
}

.english{
margin-top:5px;
font-size:18px;
}

.turkish{
margin-top:10px;
font-size:24px;
line-height:1.35;
}

.status{
margin-top:12px;
font-size:13px;
color:#999;
}

.small{
font-size:12px;
color:#777;
margin-top:8px;
}
</style>
</head>

<body>

<div class="app">

<h1>🎮 PS5 Türkçe Çeviri</h1>

<div class="desc">
Telefonu PS5 ekranına tut. Altyazı otomatik algılanır.
</div>

<div class="camera">

<video id="video" autoplay playsinline muted></video>

<div class="scan"></div>

</div>

<div class="controls">

<button onclick="startCamera()">
📷 Kamerayı Aç
</button>

<button class="dark" onclick="startAuto()">
▶️ Otomatik Çeviri
</button>

<button class="dark" onclick="stopCamera()">
⏹ Durdur
</button>

</div>

<div class="result">

<div class="label">
İNGİLİZCE
</div>

<div class="english" id="english">
Henüz altyazı okunmadı.
</div>

<div class="label" style="margin-top:15px">
TÜRKÇE
</div>

<div class="turkish" id="turkish">
Türkçe çeviri burada görünecek.
</div>

<div class="status" id="status">
Hazır.
</div>

<div class="small">
Otomatik tarama aktif olduğunda yeni altyazılar kendiliğinden çevrilir.
</div>

</div>

</div>

<canvas id="canvas" style="display:none"></canvas>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>

let stream=null;
let worker=null;
let scanning=false;
let processing=false;
let lastText="";
let lastTranslation="";

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");

const english=document.getElementById("english");
const turkish=document.getElementById("turkish");
const status=document.getElementById("status");


async function startCamera(){

try{

if(stream) return;

stream=await navigator.mediaDevices.getUserMedia({

video:{
facingMode:{
ideal:"environment"
},
width:{
ideal:1920
},
height:{
ideal:1080
}
},

audio:false

});

video.srcObject=stream;

await video.play();

status.textContent=
"Kamera açık. Altyazıyı beyaz çerçeveye getir.";

}catch(error){

status.textContent=
"Kamera açılamadı: "+error.message;

}

}


function stopCamera(){

scanning=false;

if(stream){

stream.getTracks().forEach(track=>{
track.stop();
});

}

stream=null;
video.srcObject=null;

status.textContent="Durduruldu.";

}


async function startAuto(){

if(!stream){

await startCamera();

}

if(!stream) return;

if(scanning) return;

scanning=true;

status.textContent=
"Otomatik altyazı taraması başladı.";

autoScan();

}


async function autoScan(){

if(!scanning) return;

if(!processing && video.videoWidth){

processing=true;

try{

await scanSubtitle();

}catch(error){

console.log(error);

}

processing=false;

}

setTimeout(autoScan,1400);

}


function preprocess(){

const ctx=canvas.getContext("2d");

const width=video.videoWidth;
const height=video.videoHeight;

/*
Altyazının bulunduğu alt bölgeyi alıyoruz.
*/

const cropY=Math.floor(height*0.55);
const cropH=Math.floor(height*0.40);

canvas.width=width*2;
canvas.height=cropH*2;

ctx.drawImage(
video,
0,
cropY,
width,
cropH,
0,
0,
canvas.width,
canvas.height
);

/*
Görüntüyü OCR için güçlendir.
*/

const image=ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const data=image.data;

for(let i=0;i<data.length;i+=4){

const r=data[i];
const g=data[i+1];
const b=data[i+2];

let gray=
0.299*r+
0.587*g+
0.114*b;

/*
Kontrast artır.
*/

gray=(gray-128)*1.8+128;

gray=Math.max(
0,
Math.min(255,gray)
);

data[i]=gray;
data[i+1]=gray;
data[i+2]=gray;

}

ctx.putImageData(image,0,0);

}


async function prepareOCR(){

if(worker) return;

status.textContent=
"OCR hazırlanıyor...";

worker=await Tesseract.createWorker("eng");

await worker.setParameters({

tessedit_pageseg_mode:"6",

preserve_interword_spaces:"1"

});

}


async function scanSubtitle(){

if(!video.videoWidth) return;

preprocess();

await prepareOCR();

status.textContent=
"Altyazı okunuyor...";

const result=
await worker.recognize(canvas);

let text=
result.data.text || "";

text=text
.replace(/\n+/g," ")
.replace(/\s+/g," ")
.trim();


/*
OCR'nin saçma sonuçlarını filtrele.
*/

if(!text){

return;

}

if(text.length<3){

return;

}


/*
Sadece anlamsız karakterlerden oluşuyorsa gönderme.
*/

const letters=
(text.match(/[A-Za-z]/g)||[]).length;

if(letters<2){

return;

}


/*
Aynı altyazıyı tekrar çevirme.
*/

if(
text.toLowerCase()===
lastText.toLowerCase()
){

return;

}

lastText=text;

english.textContent=text;

status.textContent=
"Türkçeye çevriliyor...";


try{

const response=await fetch(

"https://api.mymemory.translated.net/get?q="+
encodeURIComponent(text)+
"&langpair=en|tr"

);

const data=
await response.json();

if(
data &&
data.responseData &&
data.responseData.translatedText
){

let translated=
data.responseData.translatedText.trim();

if(translated){

lastTranslation=translated;

turkish.textContent=
translated;

status.textContent=
"Otomatik çeviri hazır.";

}

}else{

status.textContent=
"Çeviri alınamadı.";

}

}catch(error){

status.textContent=
"Çeviri bağlantısı başarısız.";

}

}

</script>

</body>
</html>
