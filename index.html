<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>🎮 PS5 Türkçe Çeviri V5</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:#0d0f12;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

h1{
  font-size:32px;
  margin:10px 0;
}

.subtitle{
  color:#aaa;
  font-size:20px;
  line-height:1.4;
  margin-bottom:25px;
}

.camera-box{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:28px;
  overflow:hidden;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.scan-area{
  position:absolute;
  left:7%;
  right:7%;
  bottom:5%;
  height:18%;
  border:3px solid white;
  border-radius:22px;
  box-shadow:0 0 25px rgba(255,255,255,.65);
  pointer-events:none;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:25px;
}

button{
  border:0;
  border-radius:25px;
  padding:18px 12px;
  font-size:20px;
  font-weight:700;
  background:#292d35;
  color:white;
}

button.primary{
  background:white;
  color:#111;
}

button:disabled{
  opacity:.45;
}

.result{
  margin-top:30px;
  padding:25px;
  border-radius:28px;
  background:#1b1e23;
}

.label{
  color:#999;
  font-size:18px;
  margin-bottom:8px;
}

.text{
  font-size:26px;
  line-height:1.35;
  min-height:40px;
  margin-bottom:25px;
}

.status{
  color:#999;
  font-size:16px;
  line-height:1.5;
}

.confidence{
  margin-top:8px;
  color:#888;
}

.version{
  margin-top:12px;
  color:#777;
  font-size:15px;
}

.hidden{
  display:none;
}

@media(max-width:600px){
  body{
    padding:18px;
  }

  h1{
    font-size:30px;
  }

  .subtitle{
    font-size:19px;
  }

  button{
    font-size:18px;
  }

  .text{
    font-size:24px;
  }
}
</style>
</head>

<body>

<h1>🎮 PS5 Türkçe Çeviri V5</h1>

<div class="subtitle">
Telefonu PS5 ekranına tut. Altyazı otomatik algılanır ve Türkçeye çevrilir.
</div>

<div class="camera-box">

  <video id="video"
         autoplay
         muted
         playsinline
         webkit-playsinline>
  </video>

  <div class="scan-area"></div>

</div>

<div class="controls">

  <button id="cameraBtn" class="primary">
    📷 Kamerayı Aç
  </button>

  <button id="startBtn" disabled>
    ▶️ Otomatik Çevir
  </button>

  <button id="stopBtn" disabled>
    ⏹ Durdur
  </button>

</div>

<div class="result">

  <div class="label">İNGİLİZCE</div>

  <div id="englishText" class="text">
    Henüz altyazı okunmadı.
  </div>

  <div class="label">TÜRKÇE</div>

  <div id="turkishText" class="text">
    Türkçe çeviri burada görünecek.
  </div>

  <div id="status" class="status">
    Hazır.
  </div>

  <div id="confidence" class="confidence">
    OCR güveni: -
  </div>

  <div class="version">
    V5 • Çoklu OCR + renk analizi + otomatik doğrulama
  </div>

</div>

<canvas id="canvas" class="hidden"></canvas>


<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");

const cameraBtn = document.getElementById("cameraBtn");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

const englishText = document.getElementById("englishText");
const turkishText = document.getElementById("turkishText");
const statusText = document.getElementById("status");
const confidenceText = document.getElementById("confidence");

let stream = null;
let worker = null;
let autoRunning = false;
let scanning = false;

let lastEnglish = "";
let lastTranslation = "";


// --------------------------------------------------
// DURUM
// --------------------------------------------------

function setStatus(text){
  statusText.textContent = text;
}


// --------------------------------------------------
// KAMERA
// --------------------------------------------------

async function openCamera(){

  try{

    setStatus("Kamera açılıyor...");

    if(stream){
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    stream = await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode:{
          ideal:"environment"
        },

        width:{
          ideal:1920
        },

        height:{
          ideal:1080
        },

        frameRate:{
          ideal:30
        }
      },

      audio:false

    });

    video.srcObject = stream;

    await video.play();

    cameraBtn.textContent = "📷 Kamera Açıldı";
    startBtn.disabled = false;
    stopBtn.disabled = true;

    setStatus("Kamera hazır. Otomatik çeviriyi başlatabilirsin.");

  }

  catch(error){

    console.error(error);

    setStatus(
      "Kamera açılamadı. Safari'de kamera iznini kontrol et."
    );

    alert(
      "Kamera açılamadı.\n\n" +
      "Safari kamera izni vermediyse:\n" +
      "Ayarlar → Safari → Kamera → İzin Ver"
    );

  }

}


// --------------------------------------------------
// TESSERACT HAZIRLA
// --------------------------------------------------

async function createOCRWorker(){

  if(worker){
    return;
  }

  setStatus("OCR motoru hazırlanıyor...");

  worker = await Tesseract.createWorker(
    "eng",
    1,
    {
      logger:function(info){

        if(info.status){

          let percent = "";

          if(typeof info.progress === "number"){
            percent =
              " %" +
              Math.round(info.progress * 100);
          }

          setStatus(
            "OCR hazırlanıyor: " +
            info.status +
            percent
          );
        }

      }
    }
  );

  await worker.setParameters({

    tessedit_pageseg_mode:"7",

    preserve_interword_spaces:"1",

    user_defined_dpi:"300",

    load_system_dawg:"0",

    load_freq_dawg:"0"

  });

  setStatus("OCR hazır.");

}


// --------------------------------------------------
// CANVAS VARYANTLARI
// --------------------------------------------------

function createVariant(mode){

  const width = video.videoWidth;
  const height = video.videoHeight;

  if(!width || !height){
    return null;
  }

  /*
    PS5 altyazıları genellikle ekranın alt bölümünde.
    Alt %37'lik bölümü alıyoruz.
  */

  const cropX = 0;
  const cropY = Math.floor(height * 0.60);
  const cropWidth = width;
  const cropHeight = Math.floor(height * 0.37);

  const scale = 3;

  canvas.width = cropWidth * scale;
  canvas.height = cropHeight * scale;

  const ctx = canvas.getContext("2d", {
    willReadFrequently:true
  });

  ctx.drawImage(
    video,
    cropX,
    cropY,
    cropWidth,
    cropHeight,
    0,
    0,
    canvas.width,
    canvas.height
  );

  const image = ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const data = image.data;

  for(let i=0;i<data.length;i+=4){

    const r = data[i];
    const g = data[i+1];
    const b = data[i+2];

    if(mode === "gray"){

      const gray =
        0.299*r +
        0.587*g +
        0.114*b;

      let value = gray;

      value =
        (value - 128) * 1.8 + 128;

      value =
        Math.max(0,Math.min(255,value));

      data[i] = value;
      data[i+1] = value;
      data[i+2] = value;
    }


    else if(mode === "bright"){

      const brightness =
        Math.max(r,g,b);

      let value = brightness;

      if(value > 110){
        value = 255;
      }else{
        value = 0;
      }

      data[i] = value;
      data[i+1] = value;
      data[i+2] = value;
    }


    else if(mode === "cyan"){

      /*
        PS5 oyunlarında sık görülen
        beyaz/cyan altyazıları güçlendiriyoruz.
      */

      const cyanStrength =
        Math.max(g,b) - r;

      if(
        cyanStrength > 20 &&
        Math.max(g,b) > 90
      ){

        data[i] = 255;
        data[i+1] = 255;
        data[i+2] = 255;

      }else{

        const gray =
          0.299*r +
          0.587*g +
          0.114*b;

        data[i] =
          gray > 135 ? 255 : 0;

        data[i+1] = data[i];
        data[i+2] = data[i];
      }

    }

  }

  ctx.putImageData(image,0,0);

  return canvas.toDataURL("image/png");

}


// --------------------------------------------------
// OCR TEMİZLEME
// --------------------------------------------------

function cleanOCRText(text){

  if(!text){
    return "";
  }

  text = text
    .replace(/\n+/g," ")
    .replace(/\s+/g," ")
    .trim();

  /*
    OCR'ın başına/sonuna koyduğu
    gereksiz karakterleri temizle.
  */

  text = text.replace(
    /^[^A-Za-z0-9'"“”‘’\-]+/,
    ""
  );

  text = text.replace(
    /[^A-Za-z0-9'"“”‘’.,!?;:%\-]+$/,
    ""
  );

  return text.trim();
}


// --------------------------------------------------
// İNGİLİZCE KONTROLÜ
// --------------------------------------------------

function isGoodEnglish(text){

  if(!text){
    return false;
  }

  if(text.length < 3){
    return false;
  }

  const letters =
    (text.match(/[A-Za-z]/g) || []).length;

  if(letters < 3){
    return false;
  }

  const total =
    text.replace(/\s/g,"").length;

  if(total === 0){
    return false;
  }

  const letterRatio =
    letters / total;

  if(letterRatio < 0.35){
    return false;
  }

  /*
    Yaygın İngilizce kelimeler.
    OCR sonucunun gerçekten cümle olma
    ihtimalini artırmak için kullanıyoruz.
  */

  const commonWords = [
    "the",
    "you",
    "your",
    "and",
    "to",
    "of",
    "in",
    "is",
    "it",
    "this",
    "that",
    "he",
    "she",
    "we",
    "they",
    "me",
    "my",
    "for",
    "on",
    "with",
    "every",
    "day",
    "what",
    "are",
    "was",
    "have",
    "has",
    "can",
    "will",
    "not",
    "but",
    "from",
    "put"
  ];

  const lower =
    text.toLowerCase();

  const hasCommonWord =
    commonWords.some(
      word =>
        new RegExp(
          "\\b" +
          word +
          "\\b",
          "i"
        ).test(lower)
    );

  if(
    text.split(" ").length >= 2 &&
    !hasCommonWord
  ){
    return false;
  }

  return true;
}


// --------------------------------------------------
// OCR
// --------------------------------------------------

async function recognizeVariant(image){

  try{

    const result =
      await worker.recognize(image);

    const text =
      cleanOCRText(result.data.text);

    const confidence =
      Number(result.data.confidence || 0);

    return {
      text,
      confidence
    };

  }

  catch(error){

    console.error(
      "OCR hatası:",
      error
    );

    return {
      text:"",
      confidence:0
    };

  }

}


// --------------------------------------------------
// EN İYİ OCR SONUCUNU SEÇ
// --------------------------------------------------

function chooseBest(results){

  const valid =
    results.filter(
      result =>
        result.text &&
        isGoodEnglish(result.text)
    );

  if(valid.length === 0){

    /*
      Hiçbiri iyi değilse yine de
      en yüksek güvenli sonucu al.
    */

    const fallback =
      results
        .filter(r => r.text)
        .sort(
          (a,b) =>
            b.confidence -
            a.confidence
        );

    return fallback[0] || {
      text:"",
      confidence:0
    };

  }

  /*
    Güven + metin kalitesi.
  */

  valid.forEach(result => {

    let score =
      result.confidence;

    if(result.text.length >= 5){
      score += 5;
    }

    if(
      result.text.split(" ").length >= 2
    ){
      score += 8;
    }

    result.score = score;

  });

  valid.sort(
    (a,b) =>
      b.score -
      a.score
  );

  return valid[0];

}


// --------------------------------------------------
// ÇEVİRİ
// --------------------------------------------------

async function translateText(text){

  if(!text){
    return "";
  }

  if(text === lastEnglish){
    return lastTranslation;
  }

  try{

    setStatus(
      "Altyazı bulundu. Türkçeye çevriliyor..."
    );

    const url =
      "https://api.mymemory.translated.net/get?q=" +
      encodeURIComponent(text) +
      "&langpair=en|tr";

    const response =
      await fetch(url);

    if(!response.ok){
      throw new Error(
        "Çeviri sunucusu hata verdi."
      );
    }

    const data =
      await response.json();

    const translation =
      data &&
      data.responseData &&
      data.responseData.translatedText
        ? data.responseData.translatedText
        : "";

    lastEnglish = text;
    lastTranslation = translation;

    return translation;

  }

  catch(error){

    console.error(
      "Çeviri hatası:",
      error
    );

    return "";

  }

}


// --------------------------------------------------
// TEK TARAMA
// --------------------------------------------------

async function scanOnce(){

  if(scanning){
    return;
  }

  if(!worker){
    await createOCRWorker();
  }

  if(
    video.readyState <
    HTMLMediaElement.HAVE_CURRENT_DATA
  ){
    return;
  }

  scanning = true;

  try{

    setStatus("Altyazı aranıyor...");

    const modes = [
      "gray",
      "cyan",
      "bright"
    ];

    const results = [];

    for(
      const mode of modes
    ){

      const image =
        createVariant(mode);

      if(!image){
        continue;
      }

      const result =
        await recognizeVariant(image);

      result.mode = mode;

      results.push(result);
    }

    const best =
      chooseBest(results);

    if(!best.text){

      setStatus(
        "Altyazı bulunamadı. Ekranı biraz daha yaklaştır."
      );

      confidenceText.textContent =
        "OCR güveni: -";

      return;
    }

    /*
      Çok düşük güvenli OCR sonuçlarını
      doğrudan çevirmiyoruz.
    */

    if(best.confidence < 25){

      setStatus(
        "Altyazı net okunamadı. Kamerayı sabitle."
      );

      confidenceText.textContent =
        "OCR güveni: %" +
        Math.round(best.confidence);

      return;
    }

    englishText.textContent =
      best.text;

    confidenceText.textContent =
      "OCR güveni: %" +
      Math.round(best.confidence);

    const translation =
      await translateText(best.text);

    if(translation){

      turkishText.textContent =
        translation;

      setStatus(
        "Altyazı başarıyla çevrildi."
      );

    }else{

      setStatus(
        "Altyazı okundu fakat çeviri alınamadı."
      );

    }

  }

  catch(error){

    console.error(error);

    setStatus(
      "Tarama sırasında hata oluştu."
    );

  }

  finally{

    scanning = false;

  }

}


// --------------------------------------------------
// OTOMATİK ÇEVİRİ
// --------------------------------------------------

async function startAutomatic(){

  if(!stream){

    setStatus(
      "Önce kamerayı aç."
    );

    return;
  }

  if(autoRunning){
    return;
  }

  autoRunning = true;

  startBtn.disabled = true;
  stopBtn.disabled = false;

  setStatus(
    "Otomatik çeviri başladı..."
  );

  /*
    İlk taramayı hemen yap.
  */

  await scanOnce();

  /*
    Daha sonra yaklaşık 1.8 saniyede
    bir yeni altyazı kontrol et.
  */

  while(autoRunning){

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          1800
        )
    );

    if(!autoRunning){
      break;
    }

    await scanOnce();

  }

}


// --------------------------------------------------
// DURDUR
// --------------------------------------------------

function stopAutomatic(){

  autoRunning = false;

  startBtn.disabled = false;
  stopBtn.disabled = true;

  setStatus(
    "Otomatik çeviri durduruldu."
  );

}


// --------------------------------------------------
// BUTONLAR
// --------------------------------------------------

cameraBtn.addEventListener(
  "click",
  openCamera
);

startBtn.addEventListener(
  "click",
  startAutomatic
);

stopBtn.addEventListener(
  "click",
  stopAutomatic
);


// --------------------------------------------------
// SAYFA KAPANIRKEN KAMERAYI KAPAT
// --------------------------------------------------

window.addEventListener(
  "beforeunload",
  function(){

    autoRunning = false;

    if(stream){

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }

    if(worker){

      worker
        .terminate()
        .catch(()=>{});

    }

  }
);


// --------------------------------------------------
// BAŞLANGIÇ
// --------------------------------------------------

if(
  !navigator.mediaDevices ||
  !navigator.mediaDevices.getUserMedia
){

  cameraBtn.disabled = true;

  setStatus(
    "Bu tarayıcı kamera erişimini desteklemiyor."
  );

}

</script>

</body>
</html>
