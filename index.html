<body>

<script>


// =====================================================
// ELEMANLAR
// =====================================================

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const cameraBtn =
  document.getElementById("cameraBtn");

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const englishEl =
  document.getElementById("english");

const turkishEl =
  document.getElementById("turkish");

const statusEl =
  document.getElementById("status");

const confidenceEl =
  document.getElementById("confidence");

const debugEl =
  document.getElementById("debug");


// =====================================================
// DEĞİŞKENLER
// =====================================================

let stream = null;

let worker = null;

let workerReady = false;

let automatic = false;

let scanning = false;

let lastEnglish = "";

let lastTranslation = "";

let lastSuccessfulText = "";


// =====================================================
// DURUM
// =====================================================

function status(text){

  statusEl.textContent = text;

}


// =====================================================
// KAMERA
// =====================================================

async function openCamera(){

  try{

    status(
      "Kamera açılıyor..."
    );


    if(stream){

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "getUserMedia desteklenmiyor"
      );

    }


    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:false,

          video:{

            facingMode:{
              ideal:"environment"
            },

            width:{
              ideal:1920
            },

            height:{
              ideal:1080
            },

            frameRate:{
              ideal:30
            }

          }

        });


    video.srcObject =
      stream;


    await video.play();


    cameraBtn.textContent =
      "📷 Kamera Açıldı";


    startBtn.disabled =
      false;


    status(
      "Kamera hazır."
    );

  }

  catch(error){

    console.error(
      "KAMERA HATASI:",
      error
    );


    status(
      "Kamera açılamadı."
    );


    alert(
      "Kamera açılamadı.\n\n" +
      "Safari kamera iznini kontrol et."
    );

  }

}


// =====================================================
// OCR MOTORU
// =====================================================

async function initOCR(){

  if(workerReady){

    return;

  }


  status(
    "OCR motoru hazırlanıyor..."
  );


  worker =
    await Tesseract.createWorker(

      "eng",

      1,

      {

        logger:function(info){

          if(
            info.status ===
            "recognizing text"
          ){

            if(
              typeof info.progress ===
              "number"
            ){

              status(
                "OCR çalışıyor %" +
                Math.round(
                  info.progress * 100
                )
              );

            }

          }

        }

      },

      {

        load_system_dawg:"0",

        load_freq_dawg:"0",

        load_number_dawg:"0",

        load_punc_dawg:"0"

      }

    );


  await worker.setParameters({

    preserve_interword_spaces:"1",

    user_defined_dpi:"300",

    classify_enable_learning:"0"

  });


  workerReady =
    true;


  status(
    "OCR hazır."
  );

}


// =====================================================
// HAM KAREYİ AL
// =====================================================

function getFrame(){

  const w =
    video.videoWidth;

  const h =
    video.videoHeight;


  if(
    !w ||
    !h
  ){

    return null;

  }


  /*
    Altyazı için sadece
    ekranın alt-orta bölgesine bakıyoruz.

    ViewSonic gibi üst/kenar yazıları
    mümkün olduğunca dışarıda bırakıyoruz.
  */

  const sx =
    Math.floor(
      w * 0.08
    );

  const sy =
    Math.floor(
      h * 0.62
    );

  const sw =
    Math.floor(
      w * 0.84
    );

  const sh =
    Math.floor(
      h * 0.30
    );


  const scale =
    3;


  canvas.width =
    sw * scale;

  canvas.height =
    sh * scale;


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  ctx.drawImage(

    video,

    sx,
    sy,
    sw,
    sh,

    0,
    0,
    canvas.width,
    canvas.height

  );


  return ctx;

}


// =====================================================
// RENK SINIFLANDIRMA
// =====================================================

function colorType(r,g,b){

  const max =
    Math.max(
      r,
      g,
      b
    );

  const min =
    Math.min(
      r,
      g,
      b
    );

  const saturation =
    max === 0
      ? 0
      : (max-min)/max;


  /*
    TURUNCU / SARI

    Senin son görüntündeki:
    "And I--"
    "I think it actually could work."
  */

  if(

    r > 120 &&

    g > 45 &&

    g < r * 0.90 &&

    b < g * 0.75 &&

    saturation > 0.25

  ){

    return "orange";

  }


  /*
    CYAN / MAVİ

    Önceki:
    "Put it in your lunchbox every day,"
  */

  if(

    g > 90 &&

    b > 100 &&

    r < Math.min(g,b) * 0.80 &&

    saturation > 0.20

  ){

    return "cyan";

  }


  /*
    BEYAZ

    Renkli altyazı değilse
    parlak nötr yazıları yakala.
  */

  if(

    max > 190 &&

    saturation < 0.18

  ){

    return "white";

  }


  return "none";

}


// =====================================================
// RENKLİ ALTYAZI MASKESİ
// =====================================================

function createColorMask(type){

  const ctx =
    getFrame();

  if(!ctx){

    return null;

  }


  const image =
    ctx.getImageData(

      0,
      0,
      canvas.width,
      canvas.height

    );


  const data =
    image.data;


  let minX =
    canvas.width;

  let minY =
    canvas.height;

  let maxX =
    0;

  let maxY =
    0;

  let count =
    0;


  /*
    Piksel piksel altyazı rengini ara.
  */

  for(
    let y=0;
    y<canvas.height;
    y++
  ){

    for(
      let x=0;
      x<canvas.width;
      x++
    ){

      const i =
        (y * canvas.width + x) * 4;


      const r =
        data[i];

      const g =
        data[i+1];

      const b =
        data[i+2];


      let match =
        false;


      const detected =
        colorType(
          r,
          g,
          b
        );


      if(
        detected === type
      ){

        match =
          true;

      }


      if(match){

        /*
          Beyaz/cyan/turuncu
          pikselleri beyaza çıkar.
        */

        data[i] =
          255;

        data[i+1] =
          255;

        data[i+2] =
          255;


        count++;


        if(x < minX){
          minX = x;
        }

        if(x > maxX){
          maxX = x;
        }

        if(y < minY){
          minY = y;
        }

        if(y > maxY){
          maxY = y;
        }

      }

      else{

        data[i] =
          0;

        data[i+1] =
          0;

        data[i+2] =
          0;

      }

    }

  }


  /*
    Hiç yeterli renk bulunmadı.
  */

  if(
    count < 80
  ){

    return null;

  }


  /*
    Renk piksel alanı çok küçükse
    bu muhtemelen gürültüdür.
  */

  const boxWidth =
    maxX-minX+1;

  const boxHeight =
    maxY-minY+1;


  if(
    boxWidth < 40 ||
    boxHeight < 8
  ){

    return null;

  }


  /*
    Kutuyu biraz genişlet.
    Harflerin kenarlarını kesmeyelim.
  */

  const padX =
    Math.floor(
      canvas.width * 0.025
    );

  const padY =
    Math.floor(
      canvas.height * 0.035
    );


  minX =
    Math.max(
      0,
      minX-padX
    );

  maxX =
    Math.min(
      canvas.width-1,
      maxX+padX
    );

  minY =
    Math.max(
      0,
      minY-padY
    );

  maxY =
    Math.min(
      canvas.height-1,
      maxY+padY
    );


  /*
    Yeni temiz canvas.
  */

  const output =
    document.createElement(
      "canvas"
    );


  output.width =
    (maxX-minX+1) * 2;

  output.height =
    (maxY-minY+1) * 2;


  const out =
    output.getContext(
      "2d"
    );


  out.imageSmoothingEnabled =
    false;


  out.drawImage(

    canvas,

    minX,
    minY,
    maxX-minX+1,
    maxY-minY+1,

    0,
    0,
    output.width,
    output.height

  );


  return {

    image:
      output.toDataURL(
        "image/png"
      ),

    area:
      count,

    width:
      boxWidth,

    height:
      boxHeight

  };

}


// =====================================================
// GRAYSCALE FALLBACK
// =====================================================

function createWhiteFallback(){

  const ctx =
    getFrame();

  if(!ctx){

    return null;

  }


  const image =
    ctx.getImageData(

      0,
      0,
      canvas.width,
      canvas.height

    );


  const data =
    image.data;


  for(
    let i=0;
    i<data.length;
    i+=4
  ){

    const r =
      data[i];

    const g =
      data[i+1];

    const b =
      data[i+2];


    const max =
      Math.max(
        r,
        g,
        b
      );


    const min =
      Math.min(
        r,
        g,
        b
      );


    /*
      Nötr beyaz yazı.
    */

    if(

      max > 175 &&

      (max-min) < 45

    ){

      data[i] =
        255;

      data[i+1] =
        255;

      data[i+2] =
        255;

    }

    else{

      data[i] =
        0;

      data[i+1] =
        0;

      data[i+2] =
        0;

    }

  }


  ctx.putImageData(
    image,
    0,
    0
  );


  return {

    image:
      canvas.toDataURL(
        "image/png"
      ),

    area:0,

    width:
      canvas.width,

    height:
      canvas.height

  };

}


// =====================================================
// METİN TEMİZLE
// =====================================================

function cleanText(text){

  if(!text){

    return "";

  }


  let value =
    text
      .replace(/\n+/g," ")
      .replace(/\s+/g," ")
      .trim();


  value =
    value.replace(
      /^[^A-Za-z0-9'"“”‘’.,!?;:%\-]+/,
      ""
    );


  value =
    value.replace(
      /[^A-Za-z0-9'"“”‘’.,!?;:%\-]+$/,
      ""
    );


  return value.trim();

}


// =====================================================
// OCR KALİTE PUANI
// =====================================================

function quality(text){

  if(!text){

    return -1000;

  }


  const t =
    text.trim();


  if(
    t.length < 3
  ){

    return -1000;

  }


  const letters =
    (
      t.match(
        /[A-Za-z]/g
      ) || []
    ).length;


  const numbers =
    (
      t.match(
        /[0-9]/g
      ) || []
    ).length;


  const symbols =
    (
      t.match(
        /[^A-Za-z0-9\s.,!?'"’‘-]/g
      ) || []
    ).length;


  if(
    letters < 2
  ){

    return -1000;

  }


  /*
    "23", "7", "123" gibi sonuçları öldür.
  */

  if(
    numbers > letters
  ){

    return -1000;

  }


  if(
    symbols > letters
  ){

    return -1000;

  }


  let score =
    0;


  const words =
    t
      .split(/\s+/)
      .filter(Boolean);


  /*
    Birden fazla kelime
    güçlü sinyal.
  */

  if(
    words.length >= 2
  ){

    score += 20;

  }


  if(
    words.length >= 4
  ){

    score += 10;

  }


  if(
    words.length >= 7
  ){

    score += 5;

  }


  /*
    İngilizce yaygın kelimeler.
  */

  const common = [

    "the",
    "you",
    "your",
    "and",
    "to",
    "of",
    "in",
    "is",
    "it",
    "this",
    "that",
    "he",
    "she",
    "we",
    "they",
    "me",
    "my",
    "for",
    "on",
    "with",
    "every",
    "day",
    "what",
    "are",
    "was",
    "were",
    "have",
    "has",
    "had",
    "can",
    "could",
    "will",
    "would",
    "not",
    "but",
    "from",
    "put",
    "into",
    "out",
    "do",
    "did",
    "go",
    "come",
    "get",
    "got",
    "look",
    "see",
    "know",
    "want",
    "need",
    "where",
    "why",
    "who",
    "how",
    "think",
    "actually",
    "work",
    "could"

  ];


  const lower =
    t.toLowerCase();


  let commonCount =
    0;


  for(
    const word of common
  ){

    if(
      new RegExp(
        "\\b" +
        word +
        "\\b",
        "i"
      ).test(lower)
    ){

      commonCount++;

    }

  }


  score +=
    commonCount * 13;


  /*
    Gerçek cümlelerde
    harf oranı yüksek olur.
  */

  const total =
    t.replace(
      /\s/g,
      ""
    ).length;


  const ratio =
    letters /
    Math.max(
      1,
      total
    );


  if(
    ratio > 0.55
  ){

    score += 10;

  }


  if(
    ratio > 0.70
  ){

    score += 5;

  }


  /*
    Çok kısa kelimelerden oluşan
    saçma OCR'ı cezalandır.
  */

  let tiny =
    0;


  for(
    const word of words
  ){

    if(
      word.length === 1 &&
      word !== "a" &&
      word !== "I"
    ){

      tiny++;

    }

  }


  score -=
    tiny * 12;


  /*
    TV menüsü / marka ihtimali.
  */

  const forbidden = [

    "viewsonic",
    "hdmi",
    "volume",
    "input",
    "display",
    "menu",
    "brightness",
    "contrast",
    "source",
    "monitor"

  ];


  for(
    const bad of forbidden
  ){

    if(
      lower.includes(bad)
    ){

      score -= 100;

    }

  }


  return score;

}


// =====================================================
// OCR
// =====================================================

async function recognize(
  image,
  psm
){

  if(!image){

    return {

      text:"",
      confidence:0,
      psm

    };

  }


  try{

    await worker.setParameters({

      tessedit_pageseg_mode:
        String(psm),

      preserve_interword_spaces:
        "1",

      user_defined_dpi:
        "300",

      tessedit_char_blacklist:
        "[]{}|~`"

    });


    const result =
      await worker.recognize(
        image
      );


    const text =
      cleanText(
        result.data.text
      );


    const confidence =
      Number(
        result.data.confidence ||
        0
      );


    return {

      text,

      confidence,

      psm,

      quality:
        quality(text)

    };

  }

  catch(error){

    console.error(
      "OCR:",
      error
    );


    return {

      text:"",
      confidence:0,
      psm,
      quality:-1000

    };

  }

}


// =====================================================
// EN İYİ SONUCU SEÇ
// =====================================================

function chooseBest(results){

  const valid =
    results.filter(
      r =>
        r.text &&
        r.quality > -1000
    );


  if(
    valid.length === 0
  ){

    return null;

  }


  /*
    Final puan:

    Dil kalitesi
    +
    OCR confidence
    +
    kelime sayısı
  */

  valid.forEach(
    r => {

      r.finalScore =

        r.quality +

        r.confidence * 0.60;

    }
  );


  valid.sort(
    (a,b) =>
      b.finalScore -
      a.finalScore
  );


  return valid[0];

}


// =====================================================
// ÇEVİRİ
// =====================================================

async function translateText(text){

  if(!text){

    return "";

  }


  if(
    text === lastEnglish &&
    lastTranslation
  ){

    return lastTranslation;

  }


  try{

    const controller =
      new AbortController();


    const timer =
      setTimeout(
        () =>
          controller.abort(),
        8000
      );


    const url =
      "https://api.mymemory.translated.net/get" +
      "?q=" +
      encodeURIComponent(text) +
      "&langpair=en|tr";


    const response =
      await fetch(

        url,

        {
          signal:
            controller.signal
        }

      );


    clearTimeout(
      timer
    );


    if(
      !response.ok
    ){

      throw new Error(
        "Translation HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    const translated =
      data &&
      data.responseData &&
      data.responseData.translatedText
        ? data.responseData.translatedText
        : "";


    if(translated){

      lastEnglish =
        text;

      lastTranslation =
        translated;

    }


    return translated;

  }

  catch(error){

    console.error(
      "ÇEVİRİ:",
      error
    );


    return "";

  }

}


// =====================================================
// TEK TARAMA
// =====================================================

async function scan(){

  if(scanning){

    return;

  }


  if(!workerReady){

    await initOCR();

  }


  if(
    video.readyState < 2
  ){

    return;

  }


  scanning =
    true;


  try{

    status(
      "Altyazı rengi aranıyor..."
    );


    const candidates = [];


    /*
      1 — TURUNCU
    */

    const orange =
      createColorMask(
        "orange"
      );


    if(orange){

      candidates.push({

        name:"turuncu",

        data:orange

      });

    }


    /*
      2 — CYAN
    */

    const cyan =
      createColorMask(
        "cyan"
      );


    if(cyan){

      candidates.push({

        name:"cyan",

        data:cyan

      });

    }


    /*
      3 — BEYAZ
    */

    const white =
      createColorMask(
        "white"
      );


    if(white){

      candidates.push({

        name:"beyaz",

        data:white

      });

    }


    /*
      Eğer renk maskesi bulamadıysa
      kontrollü beyaz fallback.
    */

    if(
      candidates.length === 0
    ){

      const fallback =
        createWhiteFallback();


      if(fallback){

        candidates.push({

          name:"fallback",

          data:fallback

        });

      }

    }


    /*
      OCR sonuçları.
    */

    const results = [];


    /*
      PSM 6:
      iki satırlı altyazı için.

      PSM 7:
      tek satır için.

      PSM 11:
      seyrek metin için.
    */

    const psms = [
      6,
      7,
      11
    ];


    for(
      const candidate of candidates
    ){

      for(
        const psm of psms
      ){

        const result =
          await recognize(

            candidate.data.image,

            psm

          );


        result.mode =
          candidate.name;


        results.push(
          result
        );

      }

    }


    const best =
      chooseBest(
        results
      );


    /*
      Debug bilgisi.
    */

    if(best){

      debugEl.textContent =
        "Seçilen: " +
        best.text +
        " | " +
        best.mode +
        " | PSM " +
        best.psm;

    }

    else{

      debugEl.textContent =
        "";

    }


    if(!best){

      confidenceEl.textContent =
        "OCR güveni: -";


      status(
        "Altyazı bulunamadı."
      );


      return;

    }


    /*
      Çok düşük güvenli sonuçları
      ekrana yazma.
    */

    if(
      best.confidence < 22
    ){

      confidenceEl.textContent =
        "OCR güveni: %" +
        Math.round(
          best.confidence
        );


      status(
        "Yazı bulundu fakat net okunamadı."
      );


      return;

    }


    /*
      Aşırı düşük kalite.
    */

    if(
      best.quality < 5
    ){

      status(
        "OCR sonucu güvenilir değil."
      );


      return;

    }


    englishEl.textContent =
      best.text;


    confidenceEl.textContent =
      "OCR güveni: %" +
      Math.round(
        best.confidence
      );


    /*
      Aynı cümleyi tekrar çevirmiyoruz.
    */

    if(
      best.text ===
      lastSuccessfulText
    ){

      status(
        "Altyazı algılandı."
      );


      return;

    }


    lastSuccessfulText =
      best.text;


    status(
      "Altyazı bulundu. Türkçeye çevriliyor..."
    );


    const translated =
      await translateText(
        best.text
      );


    if(translated){

      turkishEl.textContent =
        translated;


      status(
        "Altyazı başarıyla çevrildi."
      );

    }

    else{

      status(
        "Altyazı okundu fakat çeviri alınamadı."
      );

    }

  }

  catch(error){

    console.error(
      "TARAMA:",
      error
    );


    status(
      "Tarama sırasında hata oluştu."
    );

  }

  finally{

    scanning =
      false;

  }

}


// =====================================================
// OTOMATİK ÇEVİR
// =====================================================

async function startAutomatic(){

  if(!stream){

    status(
      "Önce kamerayı aç."
    );

    return;

  }


  if(automatic){

    return;

  }


  automatic =
    true;


  startBtn.disabled =
    true;

  stopBtn.disabled =
    false;


  status(
    "Otomatik çeviri başladı."
  );


  /*
    İlk tarama.
  */

  await scan();


  /*
    Her yaklaşık 2 saniyede
    yeni altyazı ara.

    OCR bitmeden ikinci tarama
    başlamıyor.
  */

  while(
    automatic
  ){

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          500
        )
    );


    if(
      !automatic
    ){

      break;

    }


    await scan();

  }

}


// =====================================================
// DURDUR
// =====================================================

function stopAutomatic(){

  automatic =
    false;


  startBtn.disabled =
    false;

  stopBtn.disabled =
    true;


  status(
    "Otomatik çeviri durduruldu."
  );

}


// =====================================================
// BUTONLAR
// =====================================================

cameraBtn.addEventListener(
  "click",
  openCamera
);


startBtn.addEventListener(
  "click",
  startAutomatic
);


stopBtn.addEventListener(
  "click",
  stopAutomatic
);


// =====================================================
// SAYFA KAPANINCA
// =====================================================

window.addEventListener(
  "beforeunload",
  function(){

    automatic =
      false;


    if(stream){

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    if(worker){

      worker
        .terminate()
        .catch(
          () => {}
        );

    }

  }
);


// =====================================================
// BAŞLANGIÇ
// =====================================================

if(
  !navigator.mediaDevices ||
  !navigator.mediaDevices.getUserMedia
){

  cameraBtn.disabled =
    true;


  status(
    "Bu tarayıcı kamera erişimini desteklemiyor."
  );

}

</script>
