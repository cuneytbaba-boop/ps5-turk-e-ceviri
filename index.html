<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>PS5 Türkçe Çeviri V4</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

background:#0d0f12;

color:white;

font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

}

.app{

max-width:800px;

margin:auto;

padding:18px;

}

h1{

font-size:25px;

margin:5px 0;

}

.desc{

color:#999;

margin-bottom:18px;

}

.camera{

position:relative;

width:100%;

aspect-ratio:16/10;

background:#000;

border-radius:18px;

overflow:hidden;

}

video{

width:100%;

height:100%;

object-fit:cover;

}

.scan{

position:absolute;

left:5%;

right:5%;

bottom:5%;

height:25%;

border:2px solid white;

border-radius:12px;

box-shadow:
0 0 14px rgba(255,255,255,.6);

pointer-events:none;

}

.controls{

display:flex;

gap:8px;

flex-wrap:wrap;

margin-top:12px;

}

button{

border:0;

border-radius:12px;

padding:13px 17px;

font-size:16px;

font-weight:700;

background:white;

color:#111;

}

button.dark{

background:#292d33;

color:white;

}

.result{

margin-top:15px;

background:#1a1d22;

border-radius:15px;

padding:17px;

}

.label{

font-size:13px;

color:#999;

}

.english{

margin-top:5px;

font-size:18px;

}

.turkish{

margin-top:10px;

font-size:24px;

line-height:1.35;

}

.status{

margin-top:12px;

font-size:13px;

color:#999;

}

.confidence{

margin-top:6px;

font-size:12px;

color:#777;

}

.small{

font-size:12px;

color:#777;

margin-top:8px;

}

</style>

</head>


<body>


<div class="app">


<h1>
🎮 PS5 Türkçe Çeviri V4
</h1>


<div class="desc">

Telefonu PS5 ekranına tut.
Altyazı otomatik algılanır ve çevrilir.

</div>


<div class="camera">


<video
id="video"
autoplay
playsinline
muted
></video>


<div class="scan"></div>


</div>


<div class="controls">


<button onclick="startCamera()">

📷 Kamerayı Aç

</button>


<button
class="dark"
onclick="startAuto()"
>

▶️ Otomatik Çeviri

</button>


<button
class="dark"
onclick="stopCamera()"
>

⏹ Durdur

</button>


</div>


<div class="result">


<div class="label">
İNGİLİZCE
</div>


<div
class="english"
id="english"
>

Henüz altyazı okunmadı.

</div>


<div
class="label"
style="margin-top:15px"
>

TÜRKÇE

</div>


<div
class="turkish"
id="turkish"
>

Türkçe çeviri burada görünecek.

</div>


<div
class="status"
id="status"
>

Hazır.

</div>


<div
class="confidence"
id="confidence"
>

OCR güveni: -

</div>


<div class="small">

V4: Çoklu OCR + renk analizi + sonuç doğrulama

</div>


</div>


</div>


<canvas
id="canvas"
style="display:none"
></canvas>


<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<script>


/* =========================================
   DEĞİŞKENLER
========================================= */


let stream = null;

let worker = null;

let scanning = false;

let processing = false;

let lastText = "";

let lastTranslation = "";

let subtitleHistory = [];

let lastAcceptedTime = 0;


const video =
document.getElementById("video");


const canvas =
document.getElementById("canvas");


const english =
document.getElementById("english");


const turkish =
document.getElementById("turkish");


const status =
document.getElementById("status");


const confidence =
document.getElementById("confidence");



/* =========================================
   KAMERA
========================================= */


async function startCamera(){

try{

if(stream){

return;

}


stream =
await navigator.mediaDevices.getUserMedia({

video:{

facingMode:{
ideal:"environment"
},

width:{
ideal:1920
},

height:{
ideal:1080
}

},

audio:false

});


video.srcObject =
stream;


await video.play();


status.textContent =
"Kamera açık. Altyazıyı beyaz çerçeveye getir.";


}catch(error){

console.log(error);


status.textContent =
"Kamera açılamadı: "
+
error.message;

}

}



/* =========================================
   DURDUR
========================================= */


async function stopCamera(){

scanning=false;


if(stream){

stream
.getTracks()
.forEach(track=>{
track.stop();
});

}


stream=null;


video.srcObject=null;


if(worker){

try{

await worker.terminate();

}catch(e){}

worker=null;

}


subtitleHistory=[];

lastText="";


status.textContent =
"Durduruldu.";

}



/* =========================================
   OTOMATİK MOD
========================================= */


async function startAuto(){

if(!stream){

await startCamera();

}


if(!stream){

return;

}


if(scanning){

return;

}


scanning=true;


status.textContent =
"Otomatik altyazı taraması başladı.";


autoScan();

}



/* =========================================
   SÜREKLİ TARAMA
========================================= */


async function autoScan(){

if(!scanning){

return;

}


if(
!processing
&&
video.videoWidth
){

processing=true;


try{

await scanSubtitle();

}catch(error){

console.log(
"OCR hatası:",
error
);

}


processing=false;

}


setTimeout(
autoScan,
1500
);

}



/* =========================================
   OCR HAZIRLA
========================================= */


async function prepareOCR(){

if(worker){

return;

}


status.textContent =
"OCR hazırlanıyor...";


worker =
await Tesseract.createWorker("eng");


await worker.setParameters({

tessedit_pageseg_mode:"7",

preserve_interword_spaces:"1",

user_defined_dpi:"300",

load_system_dawg:"0",

load_freq_dawg:"0"

});

}



/* =========================================
   OCR GÖRÜNTÜSÜ OLUŞTUR
========================================= */


function createVariant(mode){

const width =
video.videoWidth;

const height =
video.videoHeight;


/*
Altyazı bölgesi.

TV görüntüsünün yaklaşık
%63 - %93 arası.
*/


const cropY =
Math.floor(height * 0.63);


const cropH =
Math.floor(height * 0.30);


/*
3 kat büyütme.
*/


const c =
document.createElement("canvas");


c.width =
width * 3;


c.height =
cropH * 3;


const ctx =
c.getContext("2d");


ctx.imageSmoothingEnabled=true;


ctx.drawImage(

video,

0,

cropY,

width,

cropH,

0,

0,

c.width,

c.height

);


/*
Piksel işlemleri.
*/


const image =
ctx.getImageData(
0,
0,
c.width,
c.height
);


const data =
image.data;


for(
let i=0;
i<data.length;
i+=4
){

let r=data[i];

let g=data[i+1];

let b=data[i+2];


/*
---------------------------------
V1
NORMAL GRAYSCALE
---------------------------------
*/


if(mode==="gray"){

let gray =
0.299*r
+
0.587*g
+
0.114*b;


/*
Kontrast.
*/

gray =
(gray-128)
*
1.7
+
128;


gray =
Math.max(
0,
Math.min(
255,
gray
)
);


data[i]=gray;

data[i+1]=gray;

data[i+2]=gray;

}


/*
---------------------------------
V2
TURKUAZ / MAVİ
---------------------------------
*/


if(mode==="cyan"){

/*
Turkuaz yazıda
G ve B genellikle
R'den daha yüksek.
*/


let cyanStrength =
(
g+b
-
2*r
);


/*
Daha geniş tolerans.
*/


if(cyanStrength>35){

/*
Parlak yazı.
*/

data[i]=255;

data[i+1]=255;

data[i+2]=255;

}else{

/*
Koyu arka plan.
*/

data[i]=0;

data[i+1]=0;

data[i+2]=0;

}

}


/*
---------------------------------
V3
PARLAKLIK
---------------------------------
*/


if(mode==="bright"){

let brightness =
Math.max(r,g,b);


/*
Yazı kenarlarını
yakalamak için
geniş eşik.
*/


if(brightness>145){

data[i]=255;

data[i+1]=255;

data[i+2]=255;

}else{

data[i]=0;

data[i+1]=0;

data[i+2]=0;

}

}

}


ctx.putImageData(
image,
0,
0
);


return c;

}



/* =========================================
   METİN TEMİZLEME
========================================= */


function cleanOCRText(text){

if(!text){

return "";

}


/*
Satırları birleştir.
*/

text =
text
.replace(/\n+/g," ")
.replace(/\s+/g," ")
.trim();


/*
OCR'nin ürettiği
bazı özel karakterleri
temizle.
*/


text =
text.replace(
/[^A-Za-z0-9'.,!?;:\- ]/g,
" "
);


text =
text
.replace(/\s+/g," ")
.trim();


return text;

}



/* =========================================
   METİN KALİTE KONTROLÜ
========================================= */


function isGoodEnglish(text, conf){

if(!text){

return false;

}


if(text.length<4){

return false;

}


/*
Harf sayısı.
*/

const letters =
(
text.match(/[A-Za-z]/g)
||
[]
).length;


/*
Çok az harf varsa
saçmadır.
*/

if(letters<3){

return false;

}


/*
Tek karakterlik kelimeleri
fazla kabul etme.
*/

const words =
text.split(" ");


const meaningfulWords =
words.filter(
word =>
/[A-Za-z]{2,}/.test(word)
);


/*
En az bir gerçek kelime.
*/

if(
meaningfulWords.length<1
){

return false;

}


/*
Tekrar eden anlamsız
karakter kontrolü.
*/

if(
/(.)\1\1/.test(text)
){

return false;

}


/*
OCR güveni düşükse
hemen kabul etme.
*/

if(
typeof conf==="number"
&&
conf<25
){

return false;

}


return true;

}



/* =========================================
   ADAYLARI KARŞILAŞTIR
========================================= */


function normalizeForCompare(text){

return text
.toLowerCase()
.replace(/[^a-z0-9]+/g," ")
.trim();

}



/* =========================================
   EN İYİ OCR SONUCUNU BUL
========================================= */


async function recognizeVariants(){

const variants = [

{
name:"normal",
canvas:createVariant("gray")
},

{
name:"turkuaz",
canvas:createVariant("cyan")
},

{
name:"parlak",
canvas:createVariant("bright")
}

];


let results=[];


for(
const variant
of variants
){

try{

const result =
await worker.recognize(
variant.canvas
);


let text =
cleanOCRText(
result.data.text
);


let conf =
Number(
result.data.confidence
);


if(
isGoodEnglish(
text,
conf
)
){

results.push({

text:text,

confidence:conf,

mode:variant.name

});

}

}catch(error){

console.log(
variant.name,
error
);

}

}


/*
Sonuç yoksa.
*/

if(results.length===0){

return null;

}


/*
Güven puanına göre
sırala.
*/

results.sort(
(a,b)=>
b.confidence-a.confidence
);


/*
En yüksek güven.
*/

return results[0];

}



/* =========================================
   AYNI ALTYAZIYI DOĞRULA
========================================= */


function acceptCandidate(candidate){

if(!candidate){

return null;

}


const normalized =
normalizeForCompare(
candidate.text
);


/*
Son 5 sonucu tut.
*/

subtitleHistory.push({

text:candidate.text,

normalized:normalized,

confidence:candidate.confidence,

time:Date.now()

});


if(
subtitleHistory.length>5
){

subtitleHistory.shift();

}


/*
Aynı/çok benzer metin
kaç kere görüldü?
*/


const similar =
subtitleHistory.filter(
item =>
item.normalized===normalized
);


if(
similar.length>=2
){

return candidate;

}


/*
Güven çok yüksekse
tek seferde de kabul.
*/

if(
candidate.confidence>=75
){

return candidate;

}


return null;

}



/* =========================================
   ÇEVİRİ
========================================= */


async function translateText(text){

try{

const url =
"https://api.mymemory.translated.net/get?q="
+
encodeURIComponent(text)
+
"&langpair=en|tr";


const response =
await fetch(url);


if(!response.ok){

return null;

}


const data =
await response.json();


if(
data
&&
data.responseData
&&
data.responseData.translatedText
){

return data
.responseData
.translatedText
.trim();

}


return null;


}catch(error){

console.log(
"Çeviri hatası:",
error
);

return null;

}



/* =========================================
   ANA OCR
========================================= */


async function scanSubtitle(){

if(
!video.videoWidth
){

return;

}


await prepareOCR();


status.textContent =
"Altyazı analiz ediliyor...";


const candidate =
await recognizeVariants();


if(!candidate){

return;

}


/*
Aday sonucu doğrula.
*/


const accepted =
acceptCandidate(
candidate
);


if(!accepted){

status.textContent =
"Altyazı doğrulanıyor...";

return;

}


/*
Aynı yazıysa
yeniden çevirme.
*/


if(
normalizeForCompare(
accepted.text
)
===
normalizeForCompare(
lastText
)
){

return;

}


lastText =
accepted.text;


english.textContent =
accepted.text;


confidence.textContent =
"OCR güveni: "
+
Math.round(
accepted.confidence
)
+
"%";


status.textContent =
"Türkçeye çevriliyor...";


const translated =
await translateText(
accepted.text
);


if(translated){

lastTranslation =
translated;


turkish.textContent =
translated;


status.textContent =
"Otomatik çeviri hazır.";

}else{

status.textContent =
"Çeviri alınamadı.";

}

}


</script>

</body>

</html>
