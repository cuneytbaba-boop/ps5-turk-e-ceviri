<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>🎮 PS5 Türkçe Çeviri V6</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;

  background:#0d0f12;

}

  font-size:25px;
  line-height:1.35;
  min-height:38px;
  margin-bottom:25px;
}

.status{
  color:#aaa;
  font-size:16px;
  line-height:1.45;
}

.confidence{
  color:#888;
  margin-top:9px;
}

.debug{
  color:#666;
  font-size:13px;
  margin-top:10px;
  word-break:break-word;
}

.version{
  color:#666;
  font-size:14px;
  margin-top:15px;
}

.hidden{
  display:none;
}

</style>
</head>

<body>

<h1>🎮 PS5 Türkçe Çeviri V6</h1>

<div class="subtitle">
Telefonu PS5 ekranına tut. Altyazı otomatik algılanır ve Türkçeye çevrilir.
</div>

<div class="camera">

  <video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline>
  </video>

  <div class="scan-box"></div>

</div>

<div class="controls">

  <button
    id="cameraBtn"
    class="primary">
    📷 Kamerayı Aç
  </button>

  <button
    id="startBtn"
    disabled>
    ▶️ Otomatik Çevir
  </button>

  <button
    id="stopBtn"
    disabled>
    ⏹ Durdur
  </button>

</div>

<div class="result">

  <div class="label">
    İNGİLİZCE
  </div>

  <div
    id="english"
    class="text">
    Henüz altyazı okunmadı.
  </div>

  <div class="label">
    TÜRKÇE
  </div>

  <div
    id="turkish"
    class="text">
    Türkçe çeviri burada görünecek.
  </div>

  <div
    id="status"
    class="status">
    Hazır.
  </div>

  <div
    id="confidence"
    class="confidence">
    OCR güveni: -
  </div>

  <div
    id="debug"
    class="debug">
  </div>

  <div class="version">
    V6 • Çoklu görüntü + çoklu PSM + OCR doğrulama
  </div>

</div>

<canvas
  id="canvas"
  class="hidden">
</canvas>


<script>


// =====================================================
// ELEMANLAR
// =====================================================

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const cameraBtn =
  document.getElementById("cameraBtn");

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const english =
  document.getElementById("english");

const turkish =
  document.getElementById("turkish");

const statusEl =
  document.getElementById("status");

const confidenceEl =
  document.getElementById("confidence");

const debugEl =
  document.getElementById("debug");


// =====================================================
// DEĞİŞKENLER
// =====================================================

let stream = null;

let worker = null;

let workerReady = false;

let automatic = false;

let scanning = false;

let lastText = "";

let lastTranslation = "";

let lastScanTime = 0;


// =====================================================
// DURUM
// =====================================================

function status(text){

  statusEl.textContent = text;

}


// =====================================================
// KAMERA
// =====================================================

async function openCamera(){

  try{

    status(
      "Kamera açılıyor..."
    );

    if(stream){

      stream
        .getTracks()
        .forEach(
          track => track.stop()
        );

    }

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:false,

          video:{

            facingMode:{
              ideal:"environment"
            },

            width:{
              ideal:1920
            },

            height:{
              ideal:1080
            },

            frameRate:{
              ideal:30
            }

          }

        });


    video.srcObject =
      stream;

    await video.play();


    cameraBtn.textContent =
      "📷 Kamera Açıldı";

    startBtn.disabled =
      false;

    status(
      "Kamera hazır."
    );

  }

  catch(error){

    console.error(
      "KAMERA:",
      error
    );

    status(
      "Kamera açılamadı."
    );

    alert(
      "Kamera açılamadı.\n\n" +
      "Safari kamera iznini kontrol et."
    );

  }

}


// =====================================================
// OCR WORKER
// =====================================================

async function initOCR(){

  if(workerReady){

    return;

  }

  status(
    "OCR motoru hazırlanıyor..."
  );


  worker =
    await Tesseract.createWorker(
      "eng",
      1,
      {

        logger:function(info){

          if(
            info.status ===
            "recognizing text"
          ){

            if(
              typeof info.progress ===
              "number"
            ){

              status(
                "OCR çalışıyor %" +
                Math.round(
                  info.progress * 100
                )
              );

            }

          }

        },

        errorHandler:function(error){

          console.error(
            "TESSERACT:",
            error
          );

        }

      },

      {

        load_system_dawg:"0",

        load_freq_dawg:"0",

        load_number_dawg:"0",

        load_punc_dawg:"0"

      }

    );


  await worker.setParameters({

    preserve_interword_spaces:"1",

    user_defined_dpi:"300",

    classify_enable_learning:"0"

  });


  workerReady =
    true;


  status(
    "OCR hazır."
  );

}


// =====================================================
// GÖRÜNTÜ YAKALA
// =====================================================

function capture(){

  const w =
    video.videoWidth;

  const h =
    video.videoHeight;


  if(
    !w ||
    !h
  ){

    return null;

  }


  /*
    PS5 altyazısı için
    ekranın alt bölümünü alıyoruz.

    Senin görüntünde altyazı
    ekranın yaklaşık %75-88
    kısmındaydı.
  */

  const sourceX =
    Math.floor(w * 0.04);

  const sourceY =
    Math.floor(h * 0.67);

  const sourceW =
    Math.floor(w * 0.92);

  const sourceH =
    Math.floor(h * 0.24);


  /*
    4x büyütme.
  */

  const scale =
    4;


  canvas.width =
    sourceW * scale;

  canvas.height =
    sourceH * scale;


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  ctx.drawImage(

    video,

    sourceX,
    sourceY,
    sourceW,
    sourceH,

    0,
    0,
    canvas.width,
    canvas.height

  );


  return ctx;

}


// =====================================================
// NORMAL GÖRÜNTÜ
// =====================================================

function normalImage(){

  const ctx =
    capture();

  if(!ctx){

    return null;

  }


  return canvas.toDataURL(
    "image/png"
  );

}


// =====================================================
// GRAYSCALE + KONTRAST
// =====================================================

function grayImage(){

  const ctx =
    capture();

  if(!ctx){

    return null;

  }


  const image =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  const data =
    image.data;


  for(
    let i=0;
    i<data.length;
    i+=4
  ){

    const r =
      data[i];

    const g =
      data[i+1];

    const b =
      data[i+2];


    let value =
      0.299*r +
      0.587*g +
      0.114*b;


    /*
      Kontrast.
    */

    value =
      (value - 128) *
      2.2 +
      128;


    value =
      Math.max(
        0,
        Math.min(
          255,
          value
        )
      );


    data[i] =
      value;

    data[i+1] =
      value;

    data[i+2] =
      value;

  }


  ctx.putImageData(
    image,
    0,
    0
  );


  return canvas.toDataURL(
    "image/png"
  );

}


// =====================================================
// CYAN AYIRMA
// =====================================================

function cyanImage(){

  const ctx =
    capture();

  if(!ctx){

    return null;

  }


  const image =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  const data =
    image.data;


  for(
    let i=0;
    i<data.length;
    i+=4
  ){

    const r =
      data[i];

    const g =
      data[i+1];

    const b =
      data[i+2];


    /*
      Cyan yazıda:
      G/B yüksek,
      R daha düşük.
    */

    const cyan =
      Math.max(g,b) - r;

    const brightness =
      Math.max(
        r,
        g,
        b
      );


    if(
      cyan > 18 &&
      brightness > 80
    ){

      /*
        Cyan yazıyı beyaza çevir.
      */

      data[i] =
        255;

      data[i+1] =
        255;

      data[i+2] =
        255;

    }

    else{

      /*
        Arka planı mümkün olduğunca
        siyaha çek.
      */

      const gray =
        0.299*r +
        0.587*g +
        0.114*b;


      const value =
        gray > 185
          ? 255
          : 0;


      data[i] =
        value;

      data[i+1] =
        value;

      data[i+2] =
        value;

    }

  }


  ctx.putImageData(
    image,
    0,
    0
  );


  return canvas.toDataURL(
    "image/png"
  );

}


// =====================================================
// PARLAK YAZI
// =====================================================

function thresholdImage(){

  const ctx =
    capture();

  if(!ctx){

    return null;

  }


  const image =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  const data =
    image.data;


  for(
    let i=0;
    i<data.length;
    i+=4
  ){

    const r =
      data[i];

    const g =
      data[i+1];

    const b =
      data[i+2];


    const max =
      Math.max(
        r,
        g,
        b
      );


    const min =
      Math.min(
        r,
        g,
        b
      );


    /*
      Çok parlak bölgeleri
      yazı adayı olarak al.
    */

    const value =
      max > 175 &&
      (max-min) < 110
        ? 255
        : 0;


    data[i] =
      value;

    data[i+1] =
      value;

    data[i+2] =
      value;

  }


  ctx.putImageData(
    image,
    0,
    0
  );


  return canvas.toDataURL(
    "image/png"
  );

}


// =====================================================
// OCR
// =====================================================

async function recognize(
  image,
  psm
){

  if(!image){

    return {
      text:"",
      confidence:0,
      psm
    };

  }


  try{

    await worker.setParameters({

      tessedit_pageseg_mode:
        String(psm),

      preserve_interword_spaces:
        "1",

      user_defined_dpi:
        "300",

      tessedit_char_blacklist:
        "[]{}|~`"

    });


    const result =
      await worker.recognize(
        image
      );


    return {

      text:
        cleanText(
          result.data.text
        ),

      confidence:
        Number(
          result.data.confidence ||
          0
        ),

      psm

    };

  }

  catch(error){

    console.error(
      "OCR ERROR:",
      error
    );


    return {

      text:"",
      confidence:0,
      psm

    };

  }

}


// =====================================================
// METİN TEMİZLEME
// =====================================================

function cleanText(text){

  if(!text){

    return "";

  }


  let value =
    text
      .replace(/\n+/g," ")
      .replace(/\s+/g," ")
      .trim();


  value =
    value.replace(
      /^[^A-Za-z0-9'"“”‘’.,!?;:%\-]+/,
      ""
    );


  value =
    value.replace(
      /[^A-Za-z0-9'"“”‘’.,!?;:%\-]+$/,
      ""
    );


  return value.trim();

}


// =====================================================
// İNGİLİZCE KALİTE KONTROL
// =====================================================

function quality(text){

  if(!text){

    return -999;

  }


  const clean =
    text.trim();


  if(
    clean.length < 3
  ){

    return -999;

  }


  /*
    Sadece sayı / sembol.
  */

  const letters =
    (
      clean.match(
        /[A-Za-z]/g
      ) || []
    ).length;


  const digits =
    (
      clean.match(
        /[0-9]/g
      ) || []
    ).length;


  if(
    letters < 2
  ){

    return -999;

  }


  if(
    digits > letters
  ){

    return -999;

  }


  const total =
    clean.replace(
      /\s/g,
      ""
    ).length;


  if(!total){

    return -999;

  }


  const letterRatio =
    letters /
    total;


  if(
    letterRatio < 0.30
  ){

    return -999;

  }


  let score =
    0;


  /*
    Kelime sayısı.
  */

  const words =
    clean
      .split(" ")
      .filter(Boolean);


  if(
    words.length >= 2
  ){

    score += 15;

  }


  if(
    words.length >= 4
  ){

    score += 8;

  }


  /*
    İngilizcede sık görülen
    kelimeler.
  */

  const common = [

    "the",
    "you",
    "your",
    "and",
    "to",
    "of",
    "in",
    "is",
    "it",
    "this",
    "that",
    "he",
    "she",
    "we",
    "they",
    "me",
    "my",
    "for",
    "on",
    "with",
    "every",
    "day",
    "what",
    "are",
    "was",
    "were",
    "have",
    "has",
    "had",
    "can",
    "could",
    "will",
    "would",
    "not",
    "but",
    "from",
    "put",
    "your",
    "into",
    "in",
    "out",
    "do",
    "did",
    "don't",
    "dont",
    "go",
    "come",
    "get",
    "got",
    "look",
    "see",
    "know",
    "want",
    "need",
    "where",
    "why",
    "who",
    "how"

  ];


  const lower =
    clean.toLowerCase();


  let commonCount =
    0;


  for(
    const word of common
  ){

    const regex =
      new RegExp(
        "\\b" +
        word +
        "\\b",
        "i"
      );


    if(
      regex.test(lower)
    ){

      commonCount++;

    }

  }


  score +=
    commonCount * 12;


  /*
    Uzun ve makul cümleleri
    tercih et.
  */

  if(
    clean.length >= 8
  ){

    score += 5;

  }


  if(
    clean.length >= 15
  ){

    score += 5;

  }


  /*
    Aşırı tek karakterli
    parçalar varsa ceza.
  */

  const oneLetterWords =
    words.filter(
      w =>
        w.length === 1 &&
        !["a","I"].includes(w)
    ).length;


  score -=
    oneLetterWords * 8;


  return score;

}


// =====================================================
// SONUÇ SEÇ
// =====================================================

function chooseBest(results){

  const scored =
    results
      .map(
        result => ({

          ...result,

          quality:
            quality(
              result.text
            )

        })
      )
      .filter(
        result =>
          result.quality >
          -999
      );


  if(
    scored.length === 0
  ){

    return {
      text:"",
      confidence:0,
      quality:-999
    };

  }


  /*
    Confidence + dil kalitesi.
  */

  scored.forEach(
    result => {

      result.finalScore =
        result.quality +
        result.confidence * 0.55;

    }
  );


  scored.sort(
    (a,b) =>
      b.finalScore -
      a.finalScore
  );


  return scored[0];

}


// =====================================================
// ÇEVİRİ
// =====================================================

async function translateText(text){

  if(!text){

    return "";

  }


  if(
    text === lastText &&
    lastTranslation
  ){

    return lastTranslation;

  }


  try{

    const controller =
      new AbortController();


    const timeout =
      setTimeout(
        () =>
          controller.abort(),
        8000
      );


    const url =
      "https://api.mymemory.translated.net/get" +
      "?q=" +
      encodeURIComponent(text) +
      "&langpair=en|tr";


    const response =
      await fetch(
        url,
        {
          signal:
            controller.signal
        }
      );


    clearTimeout(
      timeout
    );


    if(
      !response.ok
    ){

      throw new Error(
        "Translation HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    const result =
      data &&
      data.responseData &&
      data.responseData.translatedText
        ? data.responseData.translatedText
        : "";


    if(result){

      lastText =
        text;

      lastTranslation =
        result;

    }


    return result;

  }

  catch(error){

    console.error(
      "TRANSLATION:",
      error
    );

    return "";

  }

}


// =====================================================
// TEK TARAMA
// =====================================================

async function scan(){

  if(scanning){

    return;

  }


  if(!workerReady){

    await initOCR();

  }


  if(
    video.readyState <
    2
  ){

    return;

  }


  scanning =
    true;


  try{

    status(
      "Altyazı aranıyor..."
    );


    /*
      Aynı kamera karesinden
      dört farklı görüntü.
    */

    const images = [

      {
        name:"normal",
        image:
          normalImage()
      },

      {
        name:"gray",
        image:
          grayImage()
      },

      {
        name:"cyan",
        image:
          cyanImage()
      },

      {
        name:"threshold",
        image:
          thresholdImage()
      }

    ];


    const results = [];


    /*
      PSM 7:
      tek satır.

      PSM 11:
      seyrek metin.

      PSM 13:
      ham tek satır.
    */

    const modes = [
      7,
      11,
      13
    ];


    for(
      const item of images
    ){

      for(
        const psm of modes
      ){

        const result =
          await recognize(
            item.image,
            psm
          );


        result.mode =
          item.name;


        results.push(
          result
        );

      }

    }


    const best =
      chooseBest(
        results
      );


    /*
      Debug.
    */

    debugEl.textContent =
      best.text
        ? "Seçilen OCR: " +
          best.text +
          " | PSM " +
          best.psm +
          " | " +
          best.mode
        : "";


    if(
      !best.text
    ){

      status(
        "Altyazı okunamadı."
      );

      confidenceEl.textContent =
        "OCR güveni: -";

      return;

    }


    /*
      Çok düşük confidence.
    */

    if(
      best.confidence < 20
    ){

      status(
        "Görüntü bulundu fakat yazı net okunamadı."
      );

      confidenceEl.textContent =
        "OCR güveni: %" +
        Math.round(
          best.confidence
        );

      return;

    }


    /*
      Aynı metinse ekranda
      tutmaya devam et.
    */

    english.textContent =
      best.text;


    confidenceEl.textContent =
      "OCR güveni: %" +
      Math.round(
        best.confidence
      );


    /*
      Çok kısa saçma sonuçları
      çeviriye gönderme.
    */

    if(
      quality(
        best.text
      ) < 5
    ){

      status(
        "OCR sonucu yeterince güvenilir değil."
      );

      return;

    }


    /*
      Yeni metin geldiyse çevir.
    */

    if(
      best.text !== lastText
    ){

      status(
        "Altyazı bulundu. Çevriliyor..."
      );


      const translated =
        await translateText(
          best.text
        );


      if(translated){

        turkish.textContent =
          translated;


        status(
          "Altyazı başarıyla çevrildi."
        );

      }

      else{

        status(
          "Altyazı okundu fakat çeviri alınamadı."
        );

      }

    }

    else{

      status(
        "Altyazı algılandı."
      );

    }

  }

  catch(error){

    console.error(
      "SCAN:",
      error
    );

    status(
      "Tarama hatası oluştu."
    );

  }

  finally{

    scanning =
      false;

  }

}


// =====================================================
// OTOMATİK MOD
// =====================================================

async function startAutomatic(){

  if(!stream){

    status(
      "Önce kamerayı aç."
    );

    return;

  }


  if(automatic){

    return;

  }


  automatic =
    true;


  startBtn.disabled =
    true;

  stopBtn.disabled =
    false;


  status(
    "Otomatik çeviri başladı."
  );


  while(
    automatic
  ){

    const now =
      Date.now();


    /*
      OCR çok uzun sürerse
      üst üste işlem başlatma.
    */

    if(
      now - lastScanTime >
      1200
    ){

      lastScanTime =
        now;


      await scan();

    }


    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          250
        )
    );

  }

}


// =====================================================
// DURDUR
// =====================================================

function stopAutomatic(){

  automatic =
    false;


  startBtn.disabled =
    false;

  stopBtn.disabled =
    true;


  status(
    "Otomatik çeviri durduruldu."
  );

}


// =====================================================
// BUTONLAR
// =====================================================

cameraBtn.addEventListener(
  "click",
  openCamera
);

startBtn.addEventListener(
  "click",
  startAutomatic
);

stopBtn.addEventListener(
  "click",
  stopAutomatic
);


// =====================================================
// SAYFA KAPANIRKEN
// =====================================================

window.addEventListener(
  "beforeunload",
  async function(){

    automatic =
      false;


    if(stream){

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    if(worker){

      try{

        await worker.terminate();

      }

      catch(error){

        console.error(error);

      }

    }

  }
);


// =====================================================
// KAMERA DESTEĞİ
// =====================================================

if(
  !navigator.mediaDevices ||
  !navigator.mediaDevices.getUserMedia
){

  cameraBtn.disabled =
    true;


  status(
    "Bu tarayıcı kamera erişimini desteklemiyor."
  );

}

</script>
