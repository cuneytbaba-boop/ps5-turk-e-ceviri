<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS5 Türkçe Çeviri V3</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0d0f12;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.app{
max-width:800px;
margin:auto;
padding:18px;
}

h1{
font-size:25px;
margin:5px 0;
}

.desc{
color:#999;
margin-bottom:18px;
}

.camera{
position:relative;
width:100%;
aspect-ratio:16/10;
background:#000;
border-radius:18px;
overflow:hidden;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

.scan{
position:absolute;
left:5%;
right:5%;
bottom:5%;
height:25%;
border:2px solid white;
border-radius:12px;
box-shadow:0 0 14px rgba(255,255,255,.6);
pointer-events:none;
}

.controls{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:12px;
}

button{
border:0;
border-radius:12px;
padding:13px 17px;
font-size:16px;
font-weight:700;
background:white;
color:#111;
}

button.dark{
background:#292d33;
color:white;
}

.result{
margin-top:15px;
background:#1a1d22;
border-radius:15px;
padding:17px;
}

.label{
font-size:13px;
color:#999;
}

.english{
margin-top:5px;
font-size:18px;
}

.turkish{
margin-top:10px;
font-size:24px;
line-height:1.35;
}

.status{
margin-top:12px;
font-size:13px;
color:#999;
}

.small{
font-size:12px;
color:#777;
margin-top:8px;
}
</style>
</head>

<body>

<div class="app">

<h1>🎮 PS5 Türkçe Çeviri V3</h1>

<div class="desc">
Telefonu PS5 ekranına tut. Altyazı otomatik algılanır.
</div>

<div class="camera">

<video id="video" autoplay playsinline muted></video>

<div class="scan"></div>

</div>

<div class="controls">

<button onclick="startCamera()">
📷 Kamerayı Aç
</button>

<button class="dark" onclick="startAuto()">
▶️ Otomatik Çeviri
</button>

<button class="dark" onclick="stopCamera()">
⏹ Durdur
</button>

</div>

<div class="result">

<div class="label">İNGİLİZCE</div>

<div class="english" id="english">
Henüz altyazı okunmadı.
</div>

<div class="label" style="margin-top:15px">
TÜRKÇE
</div>

<div class="turkish" id="turkish">
Türkçe çeviri burada görünecek.
</div>

<div class="status" id="status">
Hazır.
</div>

<div class="small">
V3: Renk algılama + tek satır OCR + otomatik çeviri
</div>

</div>

</div>

<canvas id="canvas" style="display:none"></canvas>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>

let stream=null;
let worker=null;
let scanning=false;
let processing=false;
let lastText="";

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");

const english=document.getElementById("english");
const turkish=document.getElementById("turkish");
const status=document.getElementById("status");


/* =========================
   KAMERA
========================= */

async function startCamera(){

try{

if(stream) return;

stream=await navigator.mediaDevices.getUserMedia({

video:{
facingMode:{
ideal:"environment"
},

width:{
ideal:1920
},

height:{
ideal:1080
}
},

audio:false

});

video.srcObject=stream;

await video.play();

status.textContent=
"Kamera açık. Altyazıyı beyaz çerçeveye getir.";

}catch(error){

status.textContent=
"Kamera açılamadı: "+error.message;

}

}


/* =========================
   DURDUR
========================= */

async function stopCamera(){

scanning=false;

if(stream){

stream.getTracks().forEach(track=>{
track.stop();
});

}

stream=null;

video.srcObject=null;

if(worker){

try{
await worker.terminate();
}catch(e){}

worker=null;

}

status.textContent="Durduruldu.";

}


/* =========================
   OTOMATİK MOD
========================= */

async function startAuto(){

if(!stream){

await startCamera();

}

if(!stream) return;

if(scanning) return;

scanning=true;

status.textContent=
"Otomatik altyazı taraması başladı.";

autoScan();

}


async function autoScan(){

if(!scanning) return;

if(!processing && video.videoWidth){

processing=true;

try{

await scanSubtitle();

}catch(error){

console.log(error);

}

processing=false;

}

setTimeout(autoScan,1800);

}


/* =========================
   OCR HAZIRLA
========================= */

async function prepareOCR(){

if(worker) return;

status.textContent=
"OCR hazırlanıyor...";

worker=await Tesseract.createWorker("eng");

await worker.setParameters({

tessedit_pageseg_mode:"7",

preserve_interword_spaces:"1",

user_defined_dpi:"300"

});

}


/* =========================
   ALTYAZI GÖRÜNTÜSÜ
========================= */

function preprocess(){

const ctx=canvas.getContext("2d");

const width=video.videoWidth;
const height=video.videoHeight;


/*
TV'nin sadece altyazı bölümünü alıyoruz.

Üst taraf:
%64

Alt taraf:
%90
*/

const cropY=Math.floor(height*0.64);
const cropH=Math.floor(height*0.26);


/*
Çözünürlüğü 3 kat büyüt.
*/

canvas.width=width*3;
canvas.height=cropH*3;

ctx.imageSmoothingEnabled=false;

ctx.drawImage(
video,
0,
cropY,
width,
cropH,
0,
0,
canvas.width,
canvas.height
);


/*
Renk tabanlı altyazı algılama.

PS5 oyunlarında sık görülen
turkuaz/mavi altyazıyı ayırıyoruz.
*/

const image=ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const data=image.data;

for(let i=0;i<data.length;i+=4){

const r=data[i];
const g=data[i+1];
const b=data[i+2];


/*
Turkuaz/mavi yazı kontrolü.
*/

const cyan =
g>75 &&
b>90 &&
g>r*1.18 &&
b>r*1.18;


/*
Beyaz yazı kontrolü.
*/

const white =
r>165 &&
g>165 &&
b>165;


/*
Parlak sarı/beyaz yazıları da yakala.
*/

const bright =
r>150 &&
g>130 &&
b>90;


/*
Yazıyı beyaz,
arka planı siyah yap.
*/

if(cyan || white || bright){

data[i]=255;
data[i+1]=255;
data[i+2]=255;

}else{

data[i]=0;
data[i+1]=0;
data[i+2]=0;

}

}

ctx.putImageData(image,0,0);

}


/* =========================
   OCR
========================= */

async function scanSubtitle(){

if(!video.videoWidth) return;


/*
Görüntüyü hazırla.
*/

preprocess();

await prepareOCR();

status.textContent=
"Altyazı okunuyor...";


const result=
await worker.recognize(canvas);


let text=
result.data.text || "";


/*
Temizle.
*/

text=text
.replace(/\n+/g," ")
.replace(/\s+/g," ")
.trim();


/*
OCR'dan gelen gereksiz
karakterleri temizle.
*/

text=text
.replace(/[^A-Za-z0-9'.,!?;:\- ]/g," ")
.replace(/\s+/g," ")
.trim();


/*
Çok kısa sonuçları alma.
*/

if(text.length<3){

return;

}


/*
En az iki harf olmalı.
*/

const letters=
(text.match(/[A-Za-z]/g)||[]).length;

if(letters<2){

return;

}


/*
Sadece rakam/işaret ise alma.
*/

if(
letters<3 &&
!/[A-Za-z]{3,}/.test(text)
){

return;

}


/*
OCR'nin tipik saçmalıklarını azalt.
*/

const garbageWords=[
"viewsonic",
"eb",
"lal",
"pr",
"ra",
"rr",
"bin",
"be"
];

let words=text.split(" ");

text=words
.filter(word=>{

const lower=word.toLowerCase();

return !garbageWords.includes(lower);

})
.join(" ")
.trim();


if(text.length<3){

return;

}


/*
Aynı yazıyı tekrar çevirme.
*/

if(
text.toLowerCase()===
lastText.toLowerCase()
){

return;

}


lastText=text;

english.textContent=text;

status.textContent=
"Türkçeye çevriliyor...";


/* =========================
   ÇEVİRİ
========================= */

try{

const response=await fetch(

"https://api.mymemory.translated.net/get?q="+
encodeURIComponent(text)+
"&langpair=en|tr"

);


const data=
await response.json();


if(
data &&
data.responseData &&
data.responseData.translatedText
){

const translated=
data.responseData.translatedText.trim();


if(translated){

turkish.textContent=
translated;

status.textContent=
"Otomatik çeviri hazır.";

}

}else{

status.textContent=
"Çeviri alınamadı.";

}

}catch(error){

console.log(error);

status.textContent=
"Çeviri bağlantısı başarısız.";

}

}

</script>

</body>
</html>
